name: Python package

on:
  push:
    branches:
      - master
      - develop
  pull_request:

jobs:
  django_build_and_test:
    runs-on: ubuntu-latest
    env:
      # Pin the container UID/GID explicitly so every docker compose
      # invocation in this job (including the docker-compose.test.yml
      # override used for e2e) builds the same non-root user, matching
      # the chown below. Without this, UID/GID resolution has been
      # observed to differ between invocations within the same job.
      UID: "1000"
      GID: "1000"
#     strategy:
#       matrix:
#         python:
# #          - 3.6
#           - "3.12"
#         django:
# #          - "==2.2.*"
#           - "==4.2"
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - name: Allow non-root container user to write to the checkout
        run: |
          sudo chown -R 1000:1000 .
          sudo chown -R "$(id -u):$(id -g)" .git
      - name: Build application
        run: docker compose build web
        env:
          PYTHON_VERSION: ${{ matrix.python }}
          DJANGO_VERSION: ${{ matrix.django }}
          METADEFENDER_API_KEY: ${{ secrets.METADEFENDER_API_KEY }}
      - name: Run side services
        run: make wait_mysql
      - name: Migration check
        run: make check
      - name: Show settings
        run: make settings
      - name: Show installed dependencies
        run: docker compose run web pip list
      - name: Build test
        run: make test
      - name: Run e2e tests
        run: |
          # Create a user for tests.
          docker compose --file docker-compose.yml --file docker-compose.test.yml \
            run web python manage.py createsuperuserwithpassword \
            --username e2e --email e2e@example.com --password e2e --noinput
          make e2e
#     - name: Send coverage report
#       run: make coverage_send
#       env:
#         GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
#         COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
      - name: Show MySQL logs
        run: docker compose logs db
        if: failure()
      - name: Show docker process
        run: docker ps
        if: always()
