name: Python package

on:
  push:
    branches:
      - master
      - develop
  pull_request:

jobs:
  django_build_and_test:
    runs-on: ubuntu-latest
#     strategy:
#       matrix:
#         python:
# #          - 3.6
#           - "3.12"
#         django:
# #          - "==2.2.*"
#           - "==4.2"
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - name: Align container user with runner UID/GID
        # docker-compose.yml defaults UID/GID to 1000, which only matches the
        # checked-out file ownership by coincidence. Without this, containers
        # can't write to the bind-mounted repo (logs/, staticfiles/, etc).
        run: |
          echo "UID=$(id -u)" >> .env
          echo "GID=$(id -g)" >> .env
      - name: Build application
        run: docker compose build web
        env:
          PYTHON_VERSION: ${{ matrix.python }}
          DJANGO_VERSION: ${{ matrix.django }}
          METADEFENDER_API_KEY: ${{ secrets.METADEFENDER_API_KEY }}
      - name: Run side services
        run: make wait_mysql
      - name: Migration check
        run: make check
      - name: Show settings
        run: make settings
      - name: Show installed dependencies
        run: docker compose run web pip list
      - name: Build test
        run: make test
      - name: Run e2e tests
        run: make e2e
#     - name: Send coverage report
#       run: make coverage_send
#       env:
#         GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
#         COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
      - name: Show MySQL logs
        run: docker compose logs db
        if: failure()
      - name: Show docker process
        run: docker ps
        if: always()
