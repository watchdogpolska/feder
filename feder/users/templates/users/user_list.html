{% extends "base.html" %}
{% load static %}{% load i18n %}{% load i18n %}
{% block title %}{% trans 'Members' %}{% endblock %}

{% block content %}

    <div class="container">

        <div class="row">
            <div class="col-12">
                <h2>{% trans 'Users' %}</h2>
            </div>
        </div>

        <div class="row">
            <div class="col-lg-12">
                <div class="list-group">
                    {% for user in user_list %}
                        <a href="{% url 'users:detail' user.username %}" class="list-group-item">
                            <h4 class="mb-1 text-break">{{ user.username }}</h4>
                            <p class="mb-0">{{ maker.tagline }}</p>
                        </a>
                    {% endfor %}

                </div>
            </div>
        </div>

    </div>

{% endblock content %}
